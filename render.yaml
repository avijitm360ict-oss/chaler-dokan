services:
  - type: web
    name: chal-a-dokan-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: chal-a-dokan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_API_KEY
        value: demo-key-chal-dokan

databases:
  - name: chal-a-dokan-db
    plan: free
    region: singapore
    databaseName: chal_a_dokan
    user: chal_user
